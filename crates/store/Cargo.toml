[package]
name = "shuati-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shuati-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
uuid.workspace = true
tempfile.workspace = true
tracing.workspace = true
# Windows 凭据管理器 + macOS Keychain + Linux Secret Service（RustCrypto 后端，不依赖 openssl）
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
