[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/judge",
    "crates/fetch",
    "crates/ai",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
shuati-core = { path = "crates/core" }
shuati-store = { path = "crates/store" }
shuati-judge = { path = "crates/judge" }
shuati-fetch = { path = "crates/fetch" }
shuati-ai = { path = "crates/ai" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
which = "8"
tempfile = "3"
notify = "8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
